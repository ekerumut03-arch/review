<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Geri Bildirim</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.box {
  background: white;
  width: 90%;
  max-width: 400px;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

textarea {
  width: 90%;
  height: 130px;
  padding: 12px;
  margin-top: 15px;
  border-radius: 10px;
}

button {
  margin-top: 15px;
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Geri bildiriminiz bizim için önemli</h2>

<p>Deneyiminizi nasıl geliştirebiliriz?</p>

<textarea id="feedback"
placeholder="Görüşünüzü yazabilirsiniz..."></textarea>

<br>

<button onclick="gonder()">
Geri Bildirimi Gönder
</button>

<p id="message"></p>

</div>


<script>

function gonder() {

  const feedback =
    document.getElementById("feedback").value;

  localStorage.setItem(
    "demoFeedback",
    feedback
  );

   window.location.href = "tesekkur.html" + window.location.search;
}

</script>

</body>
</html>
