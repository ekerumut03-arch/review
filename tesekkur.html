<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teşekkürler</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5efe5;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 44px 24px;
      border: 1px solid #b88b45;
      border-radius: 28px;
      background: #201d1b;
      text-align: center;
      box-shadow: 0 18px 50px #30201026;
    }

    .check {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #e5b75e;
      color: #201d1b;
      font-size: 38px;
    }

    h1 {
      margin: 0 0 16px;
      color: #fff8eb;
      font-size: 26px;
      line-height: 1.35;
    }

    p {
      margin: 0;
      color: #d0c5b7;
      font-size: 15px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Geri bildiriminiz için teşekkürler!</h1>
    <p>
      Görüşleriniz bizim için değerli.<br>
      Bizi tercih ettiğiniz için teşekkür ederiz.
    </p>
  </main>
</body>
</html>
